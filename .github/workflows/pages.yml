name: Pages

# Builds the search index from plugins/, tests the site and deploys site/public to GitHub Pages.
# Pull requests only build and test; deployment happens from main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: site
        run: npm test
      - name: Build search index
        working-directory: site
        run: npm run build:index
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
